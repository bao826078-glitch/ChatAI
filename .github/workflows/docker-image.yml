
name: Build ChatAI Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image and export
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/chatai-${{ matrix.platform }}.tar

      - name: Compress image
        run: gzip /tmp/chatai-${{ matrix.platform }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatai-${{ matrix.platform }}
          path: /tmp/chatai-${{ matrix.platform }}.tar.gz
          retention-days: 7

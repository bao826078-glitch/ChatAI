name: Build and Push ChatAI Docker Images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: chatai-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ChatAI image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            bao826078/chatai:${{ github.sha }}-${{ matrix.arch }}
            ghcr.io/bao826078-glitch/chatai:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=chatai-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=chatai-${{ matrix.arch }}

  publish-manifests:
    name: Publish multi-platform manifests
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify multi-platform manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag bao826078/chatai:latest \
            --tag bao826078/chatai:"$IMAGE_TAG" \
            bao826078/chatai:"$IMAGE_TAG-amd64" \
            bao826078/chatai:"$IMAGE_TAG-arm64"

          docker buildx imagetools create \
            --tag ghcr.io/bao826078-glitch/chatai:latest \
            --tag ghcr.io/bao826078-glitch/chatai:"$IMAGE_TAG" \
            ghcr.io/bao826078-glitch/chatai:"$IMAGE_TAG-amd64" \
            ghcr.io/bao826078-glitch/chatai:"$IMAGE_TAG-arm64"

          docker buildx imagetools inspect bao826078/chatai:latest
          docker buildx imagetools inspect ghcr.io/bao826078-glitch/chatai:latest
